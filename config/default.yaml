# PaprikaVisionMDE configuration
#
# Orientation-driven paprika placement. The job of this system is to answer
# one question per fruit: which way does the stem point, and can that answer
# be trusted enough to place on.

vision_mode: "paprika"     # "paprika" | "idle"
machine_id: "paprika-01"

# =============================================================================
# PAPRIKA DETECTION AND ORIENTATION
# =============================================================================
paprika:

  # ---------------------------------------------------------------------------
  # backend: which detector finds the fruit.
  #
  #   "shape"      No model. Segments saturated fruit against the belt and
  #                orients from silhouette alone. START HERE - it runs today,
  #                before any annotation exists, so the HMI, the arrow, the
  #                angle convention and the PLC handshake can all be
  #                commissioned while the dataset is still being collected.
  #                Needs a belt that is markedly less saturated than the fruit,
  #                and cannot separate two touching paprikas.
  #
  #   "pose"       Trained YOLO pose model: one box plus stem_end and
  #                blossom_end per fruit. The production backend. Handles
  #                touching fruit and stemless fruit properly.
  #
  #   "simulator"  Synthetic fruit rotating at a known 30 deg/s, camera
  #                ignored. For proving the PLC angle convention on a bench:
  #                because the true angle is known exactly, any mismatch at the
  #                PLC end is a convention bug, not a detection bug.
  # ---------------------------------------------------------------------------
  backend: "shape"

  confidence: 0.45          # detector confidence floor (pose backend)
  max_detections: 8

  # Which fruit the actuator acts on when several are in frame.
  #   "largest"    biggest silhouette - normally the one fully in view rather
  #                than one half-entering the frame, whose angle would be
  #                measured from a partial fruit. Default for a reason.
  #   "confidence" highest orientation confidence
  #   "centered"   closest to the middle of the frame
  primary_rule: "largest"

  # Run the silhouette estimator alongside the keypoints and cross-check them.
  #
  # OFF, and measured rather than assumed. The idea was that the stem end sits
  # on the wider shoulder, so the silhouette could settle which end is which on
  # a fruit whose stem broke off. On 87 real fruit with a visible stem, that
  # holds only 66% of the time, with a median signal strength of 0.074 and a
  # median elongation of just 1.33 - a blokpaprika is too round and too
  # symmetric for its outline to carry the answer. 66% is barely better than a
  # coin toss, and a confident-looking wrong angle is the one failure this
  # system exists to prevent.
  #
  # Re-measure with tools/tune_shape.py if you switch cultivar - it reports the
  # mean flip confidence per saturation floor, which is this decision in one
  # number. On a long, tapered pepper this estimator would earn its place again.
  shape_crosscheck: false

  # When the stem cannot be found AT ALL on a fully-visible fruit, ask the
  # silhouette instead of rejecting outright.
  #
  # A paprika is measurably wider at the stem end (the shoulder, where the
  # calyx sits) than at the blossom end, and that is readable from the
  # outline alone - no stem required. This is attempted ONLY on a fruit
  # shape_orientation() itself calls "lying" (elongation above
  # min_elongation in orientation.py, currently 1.12). A round silhouette -
  # standing on either end, stem up or stem down - is left exactly as
  # before: reported as stem_not_found and rejected, with no angle invented
  # for it, because there is no wider end to read when the camera is
  # looking straight down the long axis instead of along its side.
  #
  # The angle this produces still goes through policy.min_flip_confidence
  # below like any other estimate, so a weak signal is sent round again
  # rather than placed on a coin flip - see the measurement note on
  # shape_crosscheck above for how weak that signal usually is on real
  # fruit. Set false to go back to rejecting every stemless fruit outright,
  # lying or not.
  stemless_shape_fallback: true

  # Landmark separation below this fraction of the box diagonal means the long
  # axis is pointing at the camera - the fruit is stood on one end and has no
  # meaningful in-plane rotation. Raise it if standing fruit is being reported
  # as lying at a random angle; lower it if short, blocky fruit is wrongly
  # called standing.
  min_span_ratio: 0.18

  shape:
    # Belt hue range, EXCLUDED from the fruit mask. Measured on the real line:
    # the blue belt sits in a tight band at hue 100-125 (OpenCV 0-179 scale)
    # and every paprika colour falls outside it.
    #
    # This is the rule that does the work. Saturation alone cannot separate a
    # blue belt from fruit, because the belt is strongly saturated too - blue
    # is chosen in food handling precisely because no produce is blue, and that
    # makes hue the clean discriminator. Set to [0, 0] on a neutral grey belt
    # to fall back to saturation only.
    belt_hue: [96, 145]

    # These two remove the pale structural strips at the belt edges, which are
    # unsaturated and would otherwise survive the hue rule, plus deep shadow.
    saturation_floor: 80
    value_floor: 45

    min_area_px: 4000        # ignore blobs smaller than this
    # Fallback only, used when no belt is visible. Size limits are normally
    # taken from the BELT WIDTH, not from the frame.
    #
    # Frame-relative limits encode how the camera happens to be framed. Moving
    # the lens closer made fruit occupy 20-30% of the frame instead of 5%, and
    # every one of them was then rejected as "too large" - the detector
    # returned nothing at all. Measured against the belt a paprika spans 0.33 of
    # its width (p99 0.456), and that ratio belongs to the product and the
    # machine, not to the lens.
    #
    # See MIN/MAX_FRUIT_AREA_PER_BELT2 in classical.py for the belt-relative
    # limits that are actually used.
    max_area_ratio: 0.18

    # Restrict detection to the belt surface itself. Without this, "fruit" is
    # defined as "not belt-coloured", which quietly makes every non-blue object
    # in view a candidate: a machine guard, a crate, a sleeve. Measured on a
    # belt with machine frame either side, a crate standing beside the belt was
    # detected as a fruit without this and is correctly ignored with it.
    #
    # A fruit is judged by what rings it, not by what it overlaps, and other
    # produce counts as an acceptable neighbour - clustered fruit are ringed by
    # each other rather than by belt, which is normal on a full belt.
    #
    # Falls back to searching the whole frame, with a warning in the log, when
    # no belt is recognisable - a camera knocked askew should degrade loudly
    # rather than silently stop finding product.
    restrict_to_belt: true

    # Two-stage search: first coarsely on a downscaled image for where
    # something lies, then a precise measurement per region at full resolution.
    # Every measurement comes from the original pixels; the downscale only
    # decides where to look. Measured on 160 images of 900x1092: 105 ms -> 18 ms
    # per image, with identical keypoints (0.0 px median displacement) and the
    # same number of fruit. Set to false to verify both paths agree.
    use_roi: true

    # Re-run stem detection at two other gains to see whether the stem
    # direction holds still. Costs about 1.2 ms per image and is the only thing
    # that reliably identifies an unstable green fruit before it is placed.
    stem_selfcheck: true

    # How much of the fruit diameter may be cut away by the frame border before
    # the fruit counts as "incomplete". Fruit grazing the border sit around
    # 0.16, fruit genuinely running off it around 0.69.
    edge_cut_threshold: 0.30

  pose:
    model_path: "models/paprika_pose.pt"
    imgsz: 640
    # Below this, a landmark is treated as "positioned but not visible" rather
    # than discarded. That distinction is what lets the engine tell a fruit
    # standing stem-down from one it simply failed on, so do not set it so high
    # that occluded landmarks vanish entirely.
    keypoint_confidence: 0.30

  # ---------------------------------------------------------------------------
  # policy: when is an angle trustworthy enough to act on?
  #
  # Asymmetric costs. A wrong angle places a paprika backwards and the error
  # leaves the cell; an honest "don't know" just sends it round the loop again.
  # Start strict and relax with evidence from real production logs.
  # ---------------------------------------------------------------------------
  policy:
    # A fruit lying upside down or running off the frame gets NO angle and NO
    # coordinates - not because the measurement failed, but because there is
    # nothing to measure. The robot cannot pick up an upside-down paprika and
    # turn it over, so returning a number would imply an action that does not
    # exist. The PLC simply gets NOK.
    min_angle_confidence: 0.45   # below this -> "unknown"
    min_flip_confidence: 0.40    # axis is solid but which end is the stem is not
    # true  -> a standing fruit is a reject (topple and re-present it)
    # false -> reported as "reorient" instead
    reject_standing: true

    # Maximum movement of the stem direction, in degrees, when the same fruit
    # is re-detected under an 8% lighting change. Above this the fruit is sent
    # for reorientation instead of placed.
    #
    # This is what fixed erratic scans on green paprika. On red, orange and
    # yellow the green stem separates on hue and the angle is solid to well
    # under a degree. On green the stem has to be found by shape, and a tail of
    # roughly 20% of those produce a direction that moves with the light -
    # measured up to 37 degrees between two frames of the same pepper. Nothing
    # about how confident the result looked predicted which ones: scale
    # agreement, orientation confidence and mask jitter each caught only 1 in 5.
    # Re-running the detection under the actual disturbance separates them
    # cleanly (1.1 vs 29.1 degrees median spread).
    #
    # Raise it to place more fruit and accept more misplacements; lower it to be
    # stricter. Set the whole check off with paprika.shape.stem_selfcheck.
    max_stem_spread_deg: 6.0

  # ---------------------------------------------------------------------------
  # frame: map the vision angle onto the machine's angle.
  #
  # Vision convention: 0 = stem points right on screen, 90 = stem points up,
  # counter-clockwise positive. Almost certainly not what the actuator uses.
  #
  # Commissioning procedure:
  #   1. backend: "simulator" - a known angle sweeps 0..360 at 30 deg/s.
  #   2. Watch what the PLC receives against what the HMI shows.
  #   3. If it counts the opposite way round, set angle_invert: true.
  #   4. Add the constant difference into angle_offset_deg.
  # Both are commissioning values, set once per machine. Never patch this in
  # code - the next machine will need different numbers.
  # ---------------------------------------------------------------------------
  frame:
    angle_offset_deg: 0.0
    angle_invert: false

# =============================================================================
# CAMERA
# =============================================================================
camera:
  # source: "camera" for the live camera, "folder" to run the application on
  # raw images.
  #
  # Use "folder" for tuning. On a moving belt every frame shows a different
  # paprika, so if a result changes you cannot tell whether that came from your
  # setting or from the next fruit. With a fixed folder the image is identical,
  # so every difference is attributable to what you changed - that turns tuning
  # thresholds and fixing the angle convention into a measurement rather than a
  # feeling.
  source: "folder"

  folder:
    path: "data/raw"       # .bmp/.jpg/.png, read recursively
    interval_s: 2.0        # seconds per image
    loop: true             # start over at the end
    # hold: true stays on one image until you click on in the HMI. Needed when
    # you want to study one difficult fruit instead of a sequence.
    hold: false

  device_name: "DFK 22BUC03"
  index: 0
  width: 1280
  height: 1024
  flip: -1

  # Pin exposure/gain/white-balance so the driver's auto-exposure cannot drift.
  #
  # This matters more here than it did on the OCR machine. The shape estimator
  # thresholds on absolute saturation, and auto white-balance wanders the
  # saturation of every pixel in the frame - so an untouched auto setting makes
  # detection quality change for reasons unrelated to the fruit. It also
  # poisons the training set: images collected under drifting exposure teach
  # the model that a paprika's appearance is inherently unstable.
  #
  # LOCK THESE BEFORE COLLECTING THE DATASET. Re-collecting is far more
  # expensive than getting it right now.
  manual_settings:
    enabled: false
    auto_exposure: 0.25      # backend-dependent; try 0.25, then 0, then 1, then 3
    exposure: -6
    gain: 0                  # prefer more exposure over more gain - gain adds noise
    auto_white_balance: 0
    white_balance: null
    brightness: null
    contrast: null

# =============================================================================
# HMI
# =============================================================================
hmi:
  enable_video_feed: true
  stream_quality: 75
  draw_keypoints: true
  draw_hud: true
  # Overlay refresh rate. Independent of the 30 fps stream: the stream keeps
  # running at full speed and redraws the most recent completed result.
  overlay_interval_s: 0.15
  # Blank the overlay when the newest result is older than this. Boxes that no
  # longer line up with the fruit are worse than no boxes.
  overlay_stale_after_s: 2.0

  # Show only the belt in the HMI instead of the whole sensor. The camera also
  # sees the pale side strips and whatever is behind the line, none of which is
  # inspectable, and all of which is transmitted thirty times a second and then
  # scaled down in the browser - so the part the operator needs ends up small.
  #
  # Display only. Detection keeps running on the full frame and the PLC is told
  # about full-frame coordinates; only what is drawn is shifted.
  crop_to_belt: true
  crop_margin: 0.02        # keep a little around the belt for overhanging fruit
  crop_refresh_s: 10.0     # a belt does not move, but a camera can be nudged

  # Flip confidence below which the overlay draws "stem end uncertain".
  #
  # null means "follow paprika.policy.min_flip_confidence", which is what you
  # want: the chip then marks exactly the fruit the machine will send round
  # again, so what the operator sees and what the machine does cannot drift
  # apart when somebody tunes the policy. Set a number here only to warn
  # deliberately earlier than the machine acts - for instance while watching
  # how close a batch is running to the threshold.
  flip_warning_below: null

web:
  host: "0.0.0.0"
  port: 5000

# =============================================================================
# PLC
# =============================================================================
trigger:
  enabled: true
  type: "tcp"
  host: "127.0.0.1"        # 0.0.0.0 for a real PLC on the network
  port: 5001
  trigger_byte: "0x01"
  response_ok: "OK\n"
  response_nok: "NOK\n"
  timeout_s: 5.0

  # In paprika mode the PLC needs an angle, not a verdict. On a placeable
  # fruit the response is a single semicolon-delimited line:
  #
  #     OK;<angle>;<x>;<y>;<pose>;<confidence>\n
  #     OK;137.4;612;388;lying;0.91
  #
  # <angle> is already mapped through paprika.frame, so the PLC consumes it
  # directly with no conversion. Anything not placeable - no fruit, standing
  # fruit, uncertain stem end - sends response_nok instead of a number, so the
  # PLC never has to decide whether a returned angle was trustworthy. That
  # judgement belongs on this side, where the confidence values live.
  response_format: "structured"   # "structured" | "okonly"

# =============================================================================
# OUTPUT
# =============================================================================
output:
  result_dir: "data/results"

database:
  url: "sqlite:///data/results.db"

security: {}